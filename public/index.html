<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kucay Music Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-glow"></div>
    
    <div class="container">
        <!-- Sidebar / Navigation -->
        <aside class="sidebar glass-panel">
            <div class="brand">
                <i class="fa-solid fa-music"></i>
                <h2>KucayBot</h2>
            </div>
            <nav>
                <ul>
                    <li id="nav-dashboard" class="active"><i class="fa-solid fa-house"></i> Dashboard</li>
                    <li id="nav-playlists"><i class="fa-solid fa-list"></i> Playlists</li>
                    <li onclick="alert('Ini akan mengarahkan ke halaman pengaturan bot!')"><i class="fa-solid fa-gear"></i> Settings</li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h1 id="page-title">Now Playing</h1>
                <div class="status-badge" id="bot-status">
                    <span class="dot"></span> <span id="status-text">Disconnected</span>
                </div>
            </header>

            <div id="view-dashboard">
                <section class="player-container">
                    <div class="player-card glass-panel" id="player-card">
                        <div class="artwork-container">
                            <img id="track-artwork" src="https://via.placeholder.com/200" alt="Album Art">
                        </div>
                        <div class="track-info">
                            <h2 id="track-title">Nothing playing right now</h2>
                            <p id="track-author">Play some music to get started!</p>
                        </div>
                        <div class="progress-container">
                            <div class="time" id="time-current">0:00</div>
                            <div class="progress-bar">
                                <div class="progress-fill" id="progress-fill"></div>
                            </div>
                            <div class="time" id="time-total">0:00</div>
                        </div>
                        <div class="controls">
                            <button id="btn-skip" class="control-btn" title="Skip to next track">
                                <i class="fa-solid fa-forward-step"></i>
                            </button>
                        </div>
                    </div>

                    <div class="lyrics-container glass-panel">
                        <div class="lyrics-header">
                            <h3><i class="fa-solid fa-microphone-lines"></i> Live Lyrics</h3>
                        </div>
                        <div class="lyrics-content" id="lyrics-content">
                            <div class="empty-state">No lyrics available</div>
                        </div>
                    </div>

                    <div class="queue-container glass-panel">
                        <div class="queue-header">
                            <h3>Up Next</h3>
                            <button id="btn-clear" class="btn-secondary"><i class="fa-solid fa-trash"></i> Clear Queue</button>
                        </div>
                        
                        <div class="add-song">
                            <input type="text" id="search-input" placeholder="Search or paste a link...">
                            <button id="btn-play" class="btn-primary"><i class="fa-solid fa-play"></i> Add</button>
                            <button id="btn-playnext" class="btn-accent" title="Play Next - masukkan di urutan pertama"><i class="fa-solid fa-forward"></i> Next</button>
                        </div>

                        <ul class="queue-list" id="queue-list">
                            <!-- Queue items will be injected here via JS -->
                            <div class="empty-state">Queue is empty</div>
                        </ul>
                    </div>
                </section>
            </div>

            <div id="view-playlists" style="display: none;">
                <section class="playlists-container glass-panel" id="playlists-main">
                    <div class="playlists-header">
                        <h3>Your Playlists</h3>
                        <button id="btn-create-playlist" class="btn-primary"><i class="fa-solid fa-plus"></i> Create Playlist</button>
                    </div>
                    
                    <div class="playlists-grid" id="playlists-grid">
                        <div class="empty-state">Loading playlists...</div>
                    </div>
                </section>

                <section class="playlist-details glass-panel" id="playlist-details" style="display: none;">
                    <div class="playlist-details-header">
                        <div style="display: flex; gap: 1rem; align-items: center;">
                            <button id="btn-back-playlists" class="btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back</button>
                            <h3 id="playlist-details-title">Playlist Name</h3>
                        </div>
                        <div style="display: flex; gap: 0.5rem;">
                            <button id="btn-play-playlist" class="btn-primary"><i class="fa-solid fa-play"></i> Play All</button>
                            <button id="btn-delete-playlist" class="btn-secondary" style="color: #ff4d4d; border-color: rgba(255, 77, 77, 0.3);"><i class="fa-solid fa-trash"></i> Delete</button>
                        </div>
                    </div>

                    <div class="add-song">
                        <input type="text" id="playlist-search-input" placeholder="Search or paste a link to add...">
                        <button id="btn-playlist-add" class="btn-primary"><i class="fa-solid fa-plus"></i> Add to Playlist</button>
                    </div>

                    <ul class="queue-list" id="playlist-tracks-list">
                        <div class="empty-state">Loading tracks...</div>
                    </ul>
                </section>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
